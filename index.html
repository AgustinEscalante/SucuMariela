    <!-- PWA Manifest -->

    <!-- Favicon -->

    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- Open Graph (WhatsApp / redes) -->
    <meta property="og:title" content="SucuMariela" />
    <meta property="og:description" content="Suculentas y plantas crasas - pedidos por WhatsApp" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e3528" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SucuMariela" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (registration) {
              console.log('SW registrado:', registration.scope);
            })
            .catch(function (error) {
              console.log('SW error:', error);
            });
        });
      }
    </script>
  </body>
</html>
